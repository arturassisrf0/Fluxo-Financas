<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header Exemplo</title>
    <!-- Importando a fonte Inter para ficar parecido com a imagem -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Importando ícones (FontAwesome) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="teste.css">
</head>
<body>

    <header class="navbar">
        <!-- Lado Esquerdo: Logo e Menu -->
        <div class="nav-left">
            <!-- Logo -->
            <a href="#" class="logo">
                <i class="fa-solid fa-bolt"></i> <!-- Ícone de Raio -->
            </a>

            <!-- Links de Navegação -->
            <nav class="nav-links">
                <a href="#" class="nav-item active">Overview</a>
                <a href="#" class="nav-item">Inventory</a>
                <a href="#" class="nav-item">Customers</a>
                <a href="#" class="nav-item">Products</a>
            </nav>
        </div>

        <!-- Lado Direito: Busca e Perfil -->
        <div class="nav-right">
            <!-- Barra de Pesquisa -->
            <div class="search-box">
                <input type="text" placeholder="Search...">
            </div>

            <!-- Perfil do Usuário -->
            <div class="user-profile">
                <img src="https://i.pravatar.cc/150?img=11" alt="Foto de Perfil" class="avatar">
                <i class="fa-solid fa-caret-down"></i>
            </div>
        </div>
    </header>

</body>
</html>
