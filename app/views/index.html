<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluxo Finanças - Login</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Ícones Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Nosso CSS -->
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <!-- Container Principal (Tela Cheia) -->
    <div class="login-container">
        
        <!-- LADO ESQUERDO: Design / Branding (Some no celular) -->
        <div class="side-panel d-none d-lg-flex">
            <!-- Padrão de fundo sutil -->
            <div class="side-panel-pattern"></div>
            
            <div class="side-panel-content">
                <!-- Logo -->
                <div class="d-flex align-items-center gap-3 mb-5">
                    <div class="logo-icon">
                        <i class="bi bi-graph-up-arrow"></i>
                    </div>
                    <h1 class="fw-bold mb-0 logo-text">Fluxo <span class="text-teal-300">Finanças</span></h1>
                </div>
                
                <!-- Texto de Efeito -->
                <h2 class="display-5 fw-bold mb-4">Gerencie seu futuro com <span class="text-teal-300">Inteligência</span>.</h2>
                <p class="lead opacity-75">Acompanhe suas finanças, receba insights da IA e tome decisões melhores todos os dias.</p>
                
                <!-- Mini Gráfico Decorativo -->
                <div class="mini-chart mt-5">
                    <div class="bar" style="height: 30%"></div>
                    <div class="bar" style="height: 60%"></div>
                    <div class="bar" style="height: 40%"></div>
                    <div class="bar active" style="height: 90%"></div>
                    <div class="bar" style="height: 70%"></div>
                    <div class="bar" style="height: 50%"></div>
                </div>
            </div>
        </div>

        <!-- LADO DIREITO: Formulário -->
        <div class="form-panel">
            <div class="form-wrapper">
                
                <!-- Logo Mobile (aparece só em telas pequenas) -->
                <div class="text-center mb-5 d-lg-none">
                    <h2 class="fw-bold text-teal-900 mb-1">Fluxo <span class="text-teal-500">Finanças</span></h2>
                </div>

                <div class="mb-5">
                    <h3 class="fw-bold text-teal-900 mb-2">Acesse sua conta</h3>
                    <p class="text-muted">Insira suas credenciais para continuar.</p>
                </div>

                <!-- Formulário -->
                <form>
                    <!-- Campo E-mail -->
                    <div class="mb-4">
                        <label for="email" class="form-label text-muted small fw-semibold">E-mail</label>
                        <div class="input-group">
                            <span class="input-group-text bg-transparent border-end-0 text-muted">
                                <i class="bi bi-envelope"></i>
                            </span>
                            <input type="email" class="form-control border-start-0 ps-0" id="email" placeholder="seu@email.com" required>
                        </div>
                    </div>

                    <!-- Campo Senha -->
                    <div class="mb-4">

                        <div class="input-group">
                            <span class="input-group-text bg-transparent border-end-0 text-muted">
                                <i class="bi bi-lock"></i>
                            </span>
                            <input type="password" class="form-control border-start-0 ps-0" id="password" placeholder="••••••••" required>
                        </div>
                    </div>

                    <!-- Botão de Login -->
                    <button type="submit" class="btn btn-teal-primary w-100 py-3 mb-4 d-flex justify-content-center align-items-center gap-2">
                        Entrar <i class="bi bi-arrow-right"></i>
                    </button>



                   
                </form>

                <!-- Rodapé -->
                <div class="text-center mt-5">
                    <p class="text-muted small mb-0">Não tem uma conta? <a href="#" class="text-teal-600 fw-bold text-decoration-none">Cadastre-se</a></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
