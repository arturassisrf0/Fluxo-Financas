<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluxo Finanças - Criar Conta</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Ícones Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Nosso CSS (Reaproveitando o mesmo estilo) -->
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <!-- Container Principal (Tela Cheia) -->
    <div class="login-container">
        
        <!-- LADO ESQUERDO: Design / Branding (Some no celular) -->
        <div class="side-panel d-none d-lg-flex">
            <div class="side-panel-pattern"></div>
            
            <div class="side-panel-content">
                <!-- Logo -->
                <div class="d-flex align-items-center gap-3 mb-5">
                    <div class="logo-icon">
                        <i class="bi bi-graph-up-arrow"></i>
                    </div>
                    <h1 class="fw-bold mb-0 logo-text">Fluxo <span class="text-teal-300">Finanças</span></h1>
                </div>
                
                <!-- Texto de Efeito -->
                <h2 class="display-5 fw-bold mb-4">Comece a construir seu <span class="text-teal-300">futuro financeiro</span> hoje.</h2>
                <p class="lead opacity-75">Junte-se a milhares de usuários que já usam a Inteligência Artificial para tomar decisões melhores.</p>
                
                <!-- Mini Gráfico Decorativo -->
                <div class="mini-chart mt-5">
                    <div class="bar" style="height: 30%"></div>
                    <div class="bar" style="height: 60%"></div>
                    <div class="bar" style="height: 40%"></div>
                    <div class="bar active" style="height: 90%"></div>
                    <div class="bar" style="height: 70%"></div>
                    <div class="bar" style="height: 50%"></div>
                </div>
            </div>
        </div>

        <!-- LADO DIREITO: Formulário -->
        <div class="form-panel">
            <div class="form-wrapper">
                
                <!-- Logo Mobile -->
                <div class="text-center mb-5 d-lg-none">
                    <h2 class="fw-bold text-teal-900 mb-1">Fluxo <span class="text-teal-500">Finanças</span></h2>
                </div>

                <div class="mb-4">
                    <h3 class="fw-bold text-teal-900 mb-2">Crie sua conta</h3>
                    <p class="text-muted">É rápido, fácil e gratuito.</p>
                </div>

                <!-- Formulário de Cadastro -->
                <form>
                    <!-- Campo Nome -->
                    <div class="mb-3">
                        <label for="name" class="form-label text-muted small fw-semibold">Nome Completo</label>
                        <div class="input-group">
                            <span class="input-group-text bg-transparent border-end-0 text-muted">
                                <i class="bi bi-person"></i>
                            </span>
                            <input type="text" class="form-control border-start-0 ps-0" id="name" placeholder="Seu nome" required>
                        </div>
                    </div>

                    <!-- Campo E-mail -->
                    <div class="mb-3">
                        <label for="email" class="form-label text-muted small fw-semibold">E-mail</label>
                        <div class="input-group">
                            <span class="input-group-text bg-transparent border-end-0 text-muted">
                                <i class="bi bi-envelope"></i>
                            </span>
                            <input type="email" class="form-control border-start-0 ps-0" id="email" placeholder="seu@email.com" required>
                        </div>
                    </div>

                    <!-- Campo Senha -->
                    <div class="mb-3">
                        <label for="password" class="form-label text-muted small fw-semibold">Senha</label>
                        <div class="input-group">
                            <span class="input-group-text bg-transparent border-end-0 text-muted">
                                <i class="bi bi-lock"></i>
                            </span>
                            <input type="password" class="form-control border-start-0 ps-0" id="password" placeholder="••••••••" required>
                        </div>
                    </div>

                    <!-- Campo Confirmar Senha -->
                    <div class="mb-4">
                        <label for="confirm-password" class="form-label text-muted small fw-semibold">Confirme a Senha</label>
                        <div class="input-group">
                            <span class="input-group-text bg-transparent border-end-0 text-muted">
                                <i class="bi bi-shield-lock"></i>
                            </span>
                            <input type="password" class="form-control border-start-0 ps-0" id="confirm-password" placeholder="••••••••" required>
                        </div>
                    </div>

                    <!-- Termos de Uso -->
                    <div class="form-check mb-4">
                        <input class="form-check-input" type="checkbox" id="terms" required>
                        <label class="form-check-label text-muted small" for="terms">
                            Eu concordo com os <a href="#" class="text-teal-600 text-decoration-none fw-semibold">Termos de Uso</a> e <a href="#" class="text-teal-600 text-decoration-none fw-semibold">Política de Privacidade</a>.
                        </label>
                    </div>

                    <!-- Botão de Cadastro -->
                    <button type="submit" class="btn btn-teal-primary w-100 py-3 mb-4 d-flex justify-content-center align-items-center gap-2">
                        Criar Conta <i class="bi bi-arrow-right"></i>
                    </button>

                    <!-- Divisor -->
                    <div class="d-flex align-items-center mb-4">
                        <hr class="flex-grow-1 border-secondary-subtle">
                        <span class="px-3 text-muted small">ou</span>
                        <hr class="flex-grow-1 border-secondary-subtle">
                    </div>
                </form>

                <!-- Rodapé -->
                <div class="text-center mt-5">
                    <p class="text-muted small mb-0">Já tem uma conta? <a href="index.html" class="text-teal-600 fw-bold text-decoration-none">Faça Login</a></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
